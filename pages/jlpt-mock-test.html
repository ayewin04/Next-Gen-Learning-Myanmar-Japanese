<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT Mock Tests | Next Gen Learning Myanmar</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Myanmar', sans-serif;
            background: #f7fafc;
        }

        .test-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
        }

        /* Level & Test Selector */
        .selector-panel {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .level-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        .level-tab {
            padding: 10px 24px;
            background: #edf2f7;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .level-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .test-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .test-btn-select {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .test-btn-select:hover {
            border-color: #667eea;
            background: #f7fafc;
        }

        .test-btn-select.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: #667eea;
            color: white;
        }

        .test-btn-select .test-number {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .test-btn-select .test-status {
            font-size: 0.8rem;
            margin-top: 5px;
            opacity: 0.8;
        }

        /* Test Header */
        .test-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .test-info {
            flex: 1;
        }

        .timer-box {
            background: rgba(0,0,0,0.3);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
        }

        .timer-box.warning {
            background: #e53e3e;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .progress-bar {
            background: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #48bb78, #38a169);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        /* Question Card */
        .question-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .question-text.japanese {
            font-size: 1.5rem;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }

        .option.selected {
            background: #ebf8ff;
            border-color: #3182ce;
        }

        .option-letter {
            font-weight: bold;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e2e8f0;
            border-radius: 50%;
            margin-right: 1rem;
        }

        .option.selected .option-letter {
            background: #3182ce;
            color: white;
        }

        .option-text {
            flex: 1;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .nav-btn.secondary {
            background: #cbd5e0;
            color: #4a5568;
        }

        .nav-btn.danger {
            background: #e53e3e;
            color: white;
        }

        /* Results Modal */
        .results-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .results-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .result-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin: 1rem 0;
        }

        .result-badge.pass { background: #c6f6d5; color: #22543d; }
        .result-badge.fail { background: #fed7d7; color: #742a2a; }

        .review-item {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        .review-item.correct-review { background: #f0fff4; }
        .review-item.wrong-review { background: #fff5f5; }

        .back-btn {
            display: inline-block;
            margin: 1rem;
            padding: 10px 20px;
            background: #4299e1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

                <button class="nav-btn primary" id="nextBtn">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </main>

    <div class="results-modal" id="resultsModal">
        <div class="results-content">
            <i class="fas fa-check-circle" style="font-size: 3rem; color: #48bb78;"></i>

            <div class="score-circle" id="scoreCircle">0/0</div>
            <div id="resultBadge"></div>
            <p id="scoreMessage"></p>
            <button class="nav-btn primary" id="closeResults">View Answers →</button>
            <button class="nav-btn secondary" id="retakeBtn"><i class="fas fa-sync"></i> Retake Test</button>
        </div>
    </div>

            <a href="terms.html"><i class="fas fa-file-contract"></i> Terms & Policy</a>
        </div>
        <p><i class="fas fa-heart"></i> © 2025 Next Gen Learning Myanmar. All rights reserved.</p>

    // Generate test buttons
    function generateTestButtons() {
        const container = document.getElementById('testButtons');
        container.innerHTML = '';
        for (let i = 1; i <= 3; i++) {
            const testKey = `test${i}`;
            const btn = document.createElement('div');
            btn.className = `test-btn-select ${currentTest === testKey ? 'active' : ''}`;
            btn.innerHTML = `
                <div class="test-number">📝 Test ${i}</div>
                <div class="test-status">${getTestStatus(currentLevel, testKey)}</div>
            `;
            btn.onclick = () => switchTest(testKey);
            container.appendChild(btn);
        }
    }

    function getTestStatus(level, test) {
        const saved = localStorage.getItem(`jlpt_test_${level}_${test}_score`);
        if (saved) return `⭐ ${saved}%`;
        return '⚪ Not taken';
    }

    function switchTest(testKey) {
        if (confirm('Switching tests will reset current progress. Continue?')) {
            // Stop current timer
            if (timerInterval) clearInterval(timerInterval);
            currentTest = testKey;
            loadTest();
            generateTestButtons();
        }
    }

    // Load questions for current level + test
    function loadTest() {
        if (timerInterval) clearInterval(timerInterval);
        
        const bank = questionBank[currentLevel];
        if (bank && bank[currentTest]) {
            questions = [...bank[currentTest]];
        } else {
            questions = generateFallbackQuestions();
        }
        
        // Reset all test state
        userAnswers = new Array(questions.length).fill(-1);
        currentIndex = 0;
        testCompleted = false;
        timeRemaining = timeLimits[currentLevel];
        
        // Clear any saved progress for this test
        localStorage.removeItem(`jlpt_test_${currentLevel}_${currentTest}`);
        localStorage.removeItem(`jlpt_test_${currentLevel}_${currentTest}_answers`);
        
        // Update UI
        updateTimerDisplay();
        startTimer();
        renderQuestion();
        updateProgress();
        
        document.getElementById('totalQ').textContent = questions.length;
        document.getElementById('testName').textContent = testNames[currentTest];
        document.getElementById('nextBtn').disabled = false;
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('timer').classList.remove('warning');
    }

    function generateFallbackQuestions() {
        const fallback = [];
        for (let i = 0; i < 20; i++) {
            fallback.push({
                text: `Question ${i+1}: Please select the correct answer.`,
                japanese: false,
                options: ["Option A", "Option B", "Option C", "Option D"],
                correct: 0,
                explanation: "This is a sample question."
            });
        }
        return fallback;
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (testCompleted) return;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                submitTest();
            } else {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 60) {
                    document.getElementById('timer').classList.add('warning');
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function renderQuestion() {
        if (!questions.length || currentIndex >= questions.length) return;
        
        const q = questions[currentIndex];
        const container = document.getElementById('questionContainer');
        
        container.innerHTML = `
            <div class="question-card">
                <div class="question-number">Question ${currentIndex + 1} of ${questions.length}</div>
                <div class="question-text ${q.japanese ? 'japanese' : ''}">${q.text}</div>
                <div class="options">
                    ${q.options.map((opt, idx) => `
                        <div class="option ${userAnswers[currentIndex] === idx ? 'selected' : ''}" data-opt-index="${idx}">
                            <div class="option-letter">${String.fromCharCode(65 + idx)}</div>
                            <div class="option-text">${opt}</div>
                        </div>
                    `).join('')}
                </div>
                ${userAnswers[currentIndex] !== -1 ? `<div style="margin-top: 1rem; padding: 0.8rem; background: #e2e8f0; border-radius: 8px;">
                    <i class="fas fa-info-circle"></i> <small>${q.explanation}</small>
                </div>` : ''}
            </div>
        `;
        
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                if (testCompleted) return;
                const idx = parseInt(opt.dataset.optIndex);
                selectAnswer(currentIndex, idx);
                renderQuestion();
            });
        });
        
        document.getElementById('currentQ').textContent = currentIndex + 1;
        document.getElementById('prevBtn').disabled = currentIndex === 0;
    }

    function selectAnswer(qIndex, answerIndex) {
        userAnswers[qIndex] = answerIndex;
        updateProgress();
    }

    function updateProgress() {
        const answered = userAnswers.filter(a => a !== -1).length;
        const percent = (answered / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${percent}%`;
    }

    // FIXED RESET FUNCTION - THIS IS THE ONLY ONE
    function resetTest() {
        if (confirm('Reset all answers and start over? This will clear all your progress for this test.')) {
            // Stop the timer
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // Reset all answers to -1 (not answered)
            userAnswers = new Array(questions.length).fill(-1);
            
            // Reset current index to first question
            currentIndex = 0;
            
            // Reset test completed flag
            testCompleted = false;
            
            // Reset time to full time for this level
            timeRemaining = timeLimits[currentLevel];
            
            // Clear any warning class
            document.getElementById('timer').classList.remove('warning');
            
            // Update timer display
            updateTimerDisplay();
            
            // Restart the timer
            startTimer();
            
            // Re-render the first question
            renderQuestion();
            
            // Update progress bar (should be 0%)
            updateProgress();
            
            // Enable/disable navigation buttons correctly
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = false;
            
            // Clear saved progress for this test from localStorage
            localStorage.removeItem(`jlpt_test_${currentLevel}_${currentTest}`);
            localStorage.removeItem(`jlpt_test_${currentLevel}_${currentTest}_answers`);
            
            // Close results modal if open
            const modal = document.getElementById('resultsModal');
            if (modal) {
                modal.style.display = 'none';
            }
            
            // Update test buttons to show not taken
            generateTestButtons();
            
            // Show confirmation message
            alert('Test has been reset! You can start over now.');
        }
    }

    function submitTest() {
        if (testCompleted) return;
        testCompleted = true;
        clearInterval(timerInterval);
        
        let correct = 0;
        questions.forEach((q, idx) => {
            if (userAnswers[idx] === q.correct) correct++;
        });
        
        const total = questions.length;
        const percentage = Math.round((correct / total) * 100);
        const passed = percentage >= 70;
        
        // Save score
        localStorage.setItem(`jlpt_test_${currentLevel}_${currentTest}_score`, percentage);
        generateTestButtons();
        
        document.getElementById('scoreCircle').innerHTML = `${correct}/${total}`;
        document.getElementById('resultBadge').innerHTML = `<div class="result-badge ${passed ? 'pass' : 'fail'}">${passed ? '✓ PASSED' : '✗ FAILED'}</div>`;
        document.getElementById('scoreMessage').innerHTML = passed ? 
            `Congratulations! ${percentage}% - You passed ${currentLevel.toUpperCase()} ${testNames[currentTest]}!` : 
            `${percentage}% - You need 70% to pass. Keep practicing!`;
        
        document.getElementById('resultsModal').style.display = 'flex';
    }

    function showReview() {
        document.getElementById('resultsModal').style.display = 'none';
        const container = document.getElementById('questionContainer');
        
        let reviewHtml = '<div class="question-card"><h3>📝 Answer Review</h3></div>';
        questions.forEach((q, idx) => {
            const isCorrect = userAnswers[idx] === q.correct;
            reviewHtml += `
                <div class="review-item ${isCorrect ? 'correct-review' : 'wrong-review'}">
                    <strong>Q${idx + 1}:</strong> ${q.text}<br>
                    <strong>Your answer:</strong> ${userAnswers[idx] !== -1 ? String.fromCharCode(65 + userAnswers[idx]) + '. ' + q.options[userAnswers[idx]] : 'Not answered'}
                    ${!isCorrect ? `<br><strong>Correct:</strong> ${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}` : ''}
                    <br><small><i class="fas fa-lightbulb"></i> ${q.explanation}</small>
                </div>
            `;
        });
        
        reviewHtml += `<div class="nav-buttons"><button class="nav-btn primary" id="retakeFromReview"> Retake This Test</button></div>`;
        container.innerHTML = reviewHtml;
        
        document.getElementById('retakeFromReview').addEventListener('click', () => {
            resetTest();
        });
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', () => {
        generateTestButtons();
        loadTest();
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else if (userAnswers.every(a => a !== -1)) {
                submitTest();

        }
        
        document.getElementById('closeResults').addEventListener('click', showReview);
        document.getElementById('retakeBtn').addEventListener('click', () => {
            document.getElementById('resultsModal').style.display = 'none';
            resetTest();
        });
        
        document.querySelectorAll('.level-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                if (confirm('Changing level will reset current test. Continue?')) {
                    if (timerInterval) clearInterval(timerInterval);
                    document.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentLevel = tab.dataset.level;
                    currentTest = 'test1';
                    loadTest();
                    generateTestButtons();
                }
            });
        });
    });
</script>
